name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_NAME: az_cicd_application

    steps:
      # 1. Download source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build application and execute tests
      - name: Build and Run Tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      # 4. Authenticate with Azure using OIDC
      - name: Azure Login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 5. Authenticate Docker with ACR
      - name: Login to Azure Container Registry
        if: github.event_name == 'push'
        run: |
          az acr login --name "$ACR_NAME"

      # 6. Build Docker image
      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            .

      # 7. Push Docker image to ACR
      - name: Push Docker Image to ACR
        if: github.event_name == 'push'
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"
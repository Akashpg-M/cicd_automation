name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-push:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_NAME: az_cicd_application

    steps:

      # 1. Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Scan repository for secrets
      - name: Scan for Secrets using Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Configure Java
      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 4. Build application and run tests
      - name: Build and Run Tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      # 5. Analyse code using SonarQube Cloud
      - name: SonarQube Code Analysis
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 6. Authenticate with Azure using OIDC
      - name: Azure Login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 7. Authenticate Docker with ACR
      - name: Login to Azure Container Registry
        if: github.event_name == 'push'
        run: |
          az acr login --name "$ACR_NAME"

      # 8. Build Docker image
      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            .

      # 9. Push Docker image to ACR
      - name: Push Docker Image to ACR
        if: github.event_name == 'push'
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      # 10. Get AKS credentials
      - name: Get AKS Credentials
        if: github.event_name == 'push'
        run: |
          az aks get-credentials \
            --resource-group rg-cicd-lab \
            --name aks-cicd-lab \
            --admin \
            --overwrite-existing

      # 11. Deploy application to AKS
      - name: Deploy Application to AKS
        if: github.event_name == 'push'
        run: |

          sed "s|IMAGE_PLACEHOLDER|$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}|g" \
            k8s/deployment.yml > /tmp/deployment.yml

          kubectl apply -f /tmp/deployment.yml

          kubectl apply -f k8s/service.yml

          kubectl rollout status deployment/azure-cicd-app --timeout=180s

      # 12. Verify deployment
      - name: Verify Deployment
        if: github.event_name == 'push'
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
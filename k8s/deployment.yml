apiVersion: apps/v1
kind: Deployment

metadata:
  name: azure-cicd-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: azure-cicd-app

  template:
    metadata:
      labels:
        app: azure-cicd-app

    spec:
      containers:
        - name: springboot-app
          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi